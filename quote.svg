<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght @400;700&amp;display=swap');
    </style>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA116;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="#1A1A1A" rx="15"/>
  <rect width="800" height="300" fill="url(#gradient)" rx="15"/>
  
  <!-- Border glow -->
  <rect x="2" y="2" width="796" height="296" fill="none" stroke="#FFA116" stroke-width="3" rx="15" opacity="0.8"/>
  
  <!-- Quote text -->
  <text x="400" y="100" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <tspan x="400" dy="0">I LIKE OFFENDING PEOPLE, BECAUSE I</tspan>
    <tspan x="400" dy="40">THINK PEOPLE WHO GET OFFENDED</tspan>
    <tspan x="400" dy="40">SHOULD BE OFFENDED.</tspan>
  </text>
  
  <!-- Author -->
  <text x="400" y="245" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="400" fill="#FFA116" text-anchor="middle">
    - LINUS TORVALDS -
  </text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#FFA116" opacity="0.6"/>
  <circle cx="750" cy="50" r="3" fill="#FFA116" opacity="0.6"/>
  <circle cx="50" cy="250" r="3" fill="#FFA116" opacity="0.6"/>
  <circle cx="750" cy="250" r="3" fill="#FFA116" opacity="0.6"/>
</svg>