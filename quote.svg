<svg width="600" height="225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA116;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="225" fill="#1A1A1A" rx="15"/>
  <rect width="600" height="225" fill="url(#gradient)" rx="15"/>
  
  <!-- Border glow -->
  <rect x="1.5" y="1.5" width="597" height="222" fill="none" stroke="#FFA116" stroke-width="2.25" rx="15" opacity="0.8"/>
  
  <!-- Quote text -->
  <text x="300" y="75" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <tspan x="300" dy="0">I LIKE OFFENDING PEOPLE, BECAUSE I</tspan>
    <tspan x="300" dy="30">THINK PEOPLE WHO GET OFFENDED</tspan>
    <tspan x="300" dy="30">SHOULD BE OFFENDED.</tspan>
  </text>
  
  <!-- Author -->
  <text x="300" y="183.75" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="400" fill="#FFA116" text-anchor="middle">
    - LINUS TORVALDS -
  </text>
  
  <!-- Decorative elements -->
  <circle cx="37.5" cy="37.5" r="2.25" fill="#FFA116" opacity="0.6"/>
  <circle cx="562.5" cy="37.5" r="2.25" fill="#FFA116" opacity="0.6"/>
  <circle cx="37.5" cy="187.5" r="2.25" fill="#FFA116" opacity="0.6"/>
  <circle cx="562.5" cy="187.5" r="2.25" fill="#FFA116" opacity="0.6"/>
</svg>