<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="320" rx="18" fill="url(#bg)" stroke="#1e293b"/>

  <!-- terminal buttons -->
  <circle cx="40" cy="35" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="35" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="35" r="6" fill="#27c93f"/>

  <!-- header -->
  <text x="450" y="40" text-anchor="middle"
        fill="#64748b"
        font-size="14"
        font-family="JetBrains Mono, monospace">
    ~/dev/programming
  </text>

  <line x1="0" y1="60" x2="900" y2="60" stroke="#1e293b"/>

  <!-- quote line 1 -->
  <text x="450" y="150"
        text-anchor="middle"
        font-size="30"
        font-family="JetBrains Mono, monospace"
        fill="#ef4444"
        font-weight="600">
    Bad programmers worry about the code.
  </text>

  <!-- quote line 2 -->
  <text x="450" y="210"
        text-anchor="middle"
        font-size="32"
        font-family="JetBrains Mono, monospace"
        fill="url(#accent)"
        font-weight="700">
    Good programmers worry about data structures.
  </text>

  <!-- author -->
  <text x="840" y="290"
        text-anchor="end"
        fill="#64748b"
        font-size="16"
        font-family="JetBrains Mono, monospace"
        font-style="italic">
    — Linus Torvalds
  </text>

</svg>
